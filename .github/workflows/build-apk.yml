name: Build & Release Aria AI Girlfriend APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Find and Copy APK
        run: |
          mkdir -p release-output
          APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" release-output/Aria-AI-Girlfriend-v1.0.apk
            echo "APK copied to release-output/Aria-AI-Girlfriend-v1.0.apk"
          else
            echo "Error: APK not found!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aria-AI-Girlfriend-v1.0-APK
          path: release-output/Aria-AI-Girlfriend-v1.0.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Aria AI Girlfriend v1.0.0
          body: |
            ## 🌸 Aria AI Girlfriend - Live Voice & Anime Companion
            
            ### ✨ What's New:
            - 📞 **Continuous Real Phone Call Mode**: The microphone stays permanently on like a real voice call with zero flickering.
            - 🌸 **Hinata Hyūga Waifu Anime Voice**: Soft, shy, sweet anime girl persona & character portrait.
            - 📲 **Play Store Voice Commands**: Say "Play Store se Free Fire / BGMI install karo" to automatically open Google Play Store.
            - 🔑 **Auto-configured Google AI Studio Intelligence**: Automatic API key detection & natural Hindi/Hinglish chat.
            - 🔒 **Hidden Admin Shield**: Securely protected from standard users.
            
            ### 📥 Download:
            Download **Aria-AI-Girlfriend-v1.0.apk** below and install on any Android phone (Android 7.0+).
          files: release-output/Aria-AI-Girlfriend-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
